# Native VPS template. Replace restaurant.example.com and certificate paths.
# Install inside nginx's http context (for example sites-available/spicenrice).
server {
    listen 80;
    server_name restaurant.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name restaurant.example.com;
    ssl_certificate /etc/letsencrypt/live/restaurant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurant.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/spicenrice/frontend/dist;
    index index.html;
    client_max_body_size 9m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        # Overwrite the client-provided header. TRUST_LOOPBACK_PROXY=true in Go.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 25s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8087;
        expires 7d;
    }
    location = /health { proxy_pass http://127.0.0.1:8087; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location /images/ { try_files $uri =404; expires 7d; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
