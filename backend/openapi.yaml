    "/admin/bulk-prices": {
      "post": {
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "summary": "Transactional bulk update; 100 basis points = 1%. Category 0 selects all.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "category_id": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "basis_points": {
                    "type": "integer",
                    "minimum": -10000,
                    "maximum": 100000
                  },
                  "set_cents": {
                    "anyOf": [
                      {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 10000000
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "confirm": {
                    "const": true
                  }
                },
                "required": [
                  "confirm"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "type": "boolean"
